services:
  postgres:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: roflan_bank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roflan_bank"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roflan_bank_network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roflan_bank_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      DB_DRIVER: "postgres"
      DBSOURCE: "postgresql://postgres:password@postgres:5432/roflan_bank?sslmode=disable"
      HTTP_SERVER_ADDRESS: "0.0.0.0:8080"
      GRPC_SERVER_ADDRESS: "0.0.0.0:9090"
      REDIS_ADDRESS: "redis:6379"
      TOKEN_SYMMETRIC_KEY: "12345678901234567890123456789012"
      ACCESS_TOKEN_DURATION: "15m"
      REFRESH_TOKEN_DURATION: "168h"
      ENVIRONMENT: "development"
      LOG_LEVEL: "info"
      LOG_FORMAT: "text"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - roflan_bank_network

  migrate:
    image: migrate/migrate:v4.17.0
    volumes:
      - ./db/migration:/migrations
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgresql://postgres:password@postgres:5432/roflan_bank?sslmode=disable"]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - roflan_bank_network

volumes:
  postgres_data:
  redis_data:

networks:
  roflan_bank_network:
    driver: bridge